name: Naruto Storm Mali APK Build

on:
  push:
    branches:
      - naruto-strom-mali
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naruto-strom-mali-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project-matched SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.14206865"

      - name: Build standard debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleStandardDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naruto-strom-mali-debug-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
